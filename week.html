<!-- =====================================================
     Cardiothoracic Theatre Viewer - Full Week view
     Week-at-a-glance board rendered by week.js.
     ===================================================== -->
<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full Week Rota</title>
<meta name="theme-color" content="#005EB8">
<link rel="stylesheet" href="week.css">
<script>
/* Same dark-mode preference as the dashboard, applied before paint */
if (localStorage.getItem("theme") === "dark") {
    document.documentElement.dataset.theme = "dark";
}
</script>
</head>
<body>

<header class="week-header">
    <a href="index.html" class="back-button">← Daily Dashboard</a>
    <h1>Full Week Rota</h1>
    <div id="weekTitle"></div>
</header>

<main id="weekContainer">
    <p class="wk-loading">Loading week…</p>
</main>

<script src="version.js"></script>
<script src="cadence-config.js"></script>
<script src="cadence-firestore.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="week.js"></script>

<script>
// Only the Daily Dashboard (index.html) shows the "Update Available"
// banner, but every page needs to actually pick up a new version - a
// device that only ever opens Full Week Rota directly would otherwise
// keep serving whatever was cached the last time index.html was
// visited. This registers/force-checks the service worker here too,
// and reloads once if a new one takes control while the page is open.
if ("serviceWorker" in navigator) {
    let __reloadedForUpdate = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (__reloadedForUpdate) return;
        __reloadedForUpdate = true;
        window.location.reload();
    });

    window.addEventListener("load", async () => {
        try {
            const registration = await navigator.serviceWorker.register("./service-worker.js");
            await registration.update();
        } catch (err) {
            console.error("Service Worker registration failed:", err);
        }
    });
}
</script>

</body>
</html>
